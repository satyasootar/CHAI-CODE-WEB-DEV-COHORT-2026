services:
  postgres:
    image: postgres:17
    container_name: postgres_db
    restart: always

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: bookticket

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bookticket"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: