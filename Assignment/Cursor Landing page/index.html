<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <header>
            <div class="navbar">
                <img width="95px" style="color: aliceblue;" src="./assets/svgs/cursorwhite.svg" alt="Cursor Logo">
                <nav>
                    <ul>
                        <li>Features</li>
                        <li>Enterprise</li>
                        <li>Pricing</li>
                        <li>Resources</li>
                    </ul>
                </nav>
                <div class="nav-button">
                    <button class="signin-btn">Sign in</button>
                    <button class="download-btn">Download</button>
                </div>
            </div>
        </header>
        <main>
            <section class="section">
                <div class="container">
                    <h1>Built to make you extraordinarily productive,<br> Cursor is the best way to code with AI.</h1>
                    <button class="container-btn">Download for Windows<span class="icon"> ⤓</span></button>
                    <img src="./assets/image/hero.png" alt="">
                </div>
            </section>
            <div class="container" style="margin: 0px;">
                <p>Trusted every day by millions of professional developers.</p>
                <div class="box-grid">
                    <div class="box">
                        <img src="./assets/svgs/stripe.svg" alt="stripe">
                    </div>
                    <div class="box">
                        <img src="./assets/svgs/openAI.svg" alt="openai">
                    </div>
                    <div class="box">
                        <img src="./assets/svgs/liner.svg" alt="liner">
                    </div>
                    <div class="box">
                        <img src="./assets/svgs/datadog.svg" alt="datadog">
                    </div>
                    <div class="box">
                        <img src="./assets/svgs/nvidia.svg" alt="nvidia">
                    </div>
                    <div class="box">
                        <img src="./assets/svgs/figma.svg" alt="figma">
                    </div>
                    <div class="box">
                        <img src="./assets/svgs/ramp.svg" alt="ramp">
                    </div>
                    <div class="box">
                        <img src="./assets/svgs/adobe.svg" alt="adobe">
                    </div>
            </div>
        </main>
    </div>
    
</body>
</html>
