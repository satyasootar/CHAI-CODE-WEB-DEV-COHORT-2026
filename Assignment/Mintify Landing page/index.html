<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="style.css"
    />
    <title>Mintlify - The Intelligent Knowledge Platform</title>
  </head>
  <body>
    <header>
        <!-- Navbar -->
      <nav>
        <div class="nav-logo-link-wrapper">
          <div class="logo">
            <img src="./assets/mintlify-wordmark.svg" />
          </div>
          <ul class="link">
            <li><a href="">Resources</a></li>
            <li><a href="">Documentation</a></li>
            <li><a href="">Customers</a></li>
            <li><a href="">Blog</a></li>
            <li><a href="">Pricing</a></li> 
          <ul/>
        </div>
        <div class="nav-button-wraper">
          <button class="contact-sales-btn">Contact sales</button>
          <button class="start-for-free-btn" >Start for free</button>
        </div>
      </nav>

      <main>
          <section class="hero" >
              
              <!-- badge -->
            <div class="badge">
             <span>NEW</span>
             <p>Self-updating docs with agent suggestions</p>
             <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" class="shrink-0 select-none size-4 text-white"><path d="M9 1C4.589 1 1 4.589 1 9C1 13.411 4.589 17 9 17C13.411 17 17 13.411 17 9C17 4.589 13.411 1 9 1ZM11.53 9.53L8.53 12.53C8.384 12.676 8.192 12.75 8 12.75C7.808 12.75 7.616 12.677 7.47 12.53C7.177 12.237 7.177 11.762 7.47 11.469L9.94 8.999L7.47 6.529C7.177 6.236 7.177 5.761 7.47 5.468C7.763 5.175 8.238 5.175 8.531 5.468L11.531 8.468C11.824 8.761 11.824 9.236 11.531 9.529L11.53 9.53Z" fill="currentColor"></path></svg>
            </div>

            <!-- main heading -->
             <h1>
                The Intelligent Knowledge Platform
             </h1>

             <!-- Subheading -->
              <p class="subheading">
                Get the knowledge infrastructure that keeps AI agents <br>accurate, reliable, and up to date.
              </p>

              <!-- Email input + CTA button -->
              <form>
                <input type="text" placeholder="Email address"> 
                <button class="email-cta-btn">Start now</button>
              </form>

              <!-- Large background illustration -->
              <div class="hero-background-illustration">
                <img src="./assets/hero-image-light.svg" alt="">
              </div>
        </section>

        <section>
            <div class="company-container"></div>
            <div class="company-container"></div>
            <div class="company-container"></div>
            <div class="company-container"></div>
            <div class="company-container"></div>
            <div class="company-container"></div>
            <div class="company-container"></div>
            <div class="company-container"></div>
        </section>

       </main>
    </header>
  </body>
</html>
